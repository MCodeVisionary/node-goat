trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  REGISTRY_URL: solenglatest.jfrog.io
  DOCKER_REPO_NAME: alpha-docker-virtual
  APPTRUST_APP_KEY: digiportal
  APPTRUST_EVIDENCE_KEY_ALIAS: digiportal-evidence-key
  # true: a same-day rerun always bumps only the patch digit, regardless of
  #       what changed (major/minor only apply to the first version of a new day).
  # false: major/minor is evaluated on every run from the change count alone;
  #        patch only happens when neither module changed.
  APPTRUST_SAME_DAY_PATCH_PRIORITY: 'true'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- task: JfrogCliV2@1
  name: "healthcheck"
  inputs:
    jfrogPlatformConnection: 'mpate-solenglatest-platform'
    command: 'jf rt ping'

# - task: JFrogAudit@1
#   inputs:
#     xrayConnection: 'mpatel-xray-v2'
#     watchesSource: 'none'
#     licenses: true

- task: JFrogNpm@1
  displayName: 'npm install dependencies'
  inputs:
    command: 'install'
    artifactoryConnection: 'mpate-solenglatest-rt'
    sourceRepo: 'alpha-npm-virtual'
    collectBuildInfo: true
    threads: '1'
    buildName: '$(Build.DefinitionName)'
    buildNumber: '$(Build.BuildNumber)'


- task: JFrogNpm@1
  inputs:
    command: 'pack and publish'
    artifactoryConnection: 'mpate-solenglatest-rt'
    targetRepo: 'alpha-npm-virtual'
    collectBuildInfo: true
    buildName: '$(Build.DefinitionName)'
    buildNumber: '$(Build.BuildNumber)'
    includeEnvVars: true

- script: |
    echo "registry=https://$(REGISTRY_URL)/artifactory/api/npm/alpha-npm-virtual/" > npmrc.secret
    echo "//$(REGISTRY_URL)/artifactory/api/npm/alpha-npm-virtual/:_authToken=$(oidc_token)" >> npmrc.secret
  displayName: 'Prepare npmrc secret for Docker build'

- task: JfrogCliV2@1
  displayName: 'Docker build and Publish'
  inputs:
    jfrogPlatformConnection: 'mpate-solenglatest-platform'
    command: |
      jf docker login $(REGISTRY_URL)
      jf docker image build --secret id=npmrc,src=npmrc.secret --build-arg REGISTRY_URL=$(REGISTRY_URL) --build-arg DOCKER_REPO_NAME=$(DOCKER_REPO_NAME) --module docker-build --tag $(REGISTRY_URL)/$(DOCKER_REPO_NAME)/node-goat:$(Build.BuildNumber) .
      jf docker push $(REGISTRY_URL)/$(DOCKER_REPO_NAME)/node-goat:$(Build.BuildNumber) --build-name=$(Build.DefinitionName) --build-number=$(Build.BuildNumber)
      jf rt bce $(Build.DefinitionName) $(Build.BuildNumber)
      jf rt bag $(Build.DefinitionName) $(Build.BuildNumber)

- script: rm -f npmrc.secret
  displayName: 'Clean up npmrc secret'
  condition: always()



